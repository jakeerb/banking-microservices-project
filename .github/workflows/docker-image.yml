name: Build and Push Docker Images

on:
  push:
    branches: ["main"]

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build all microservices
        run: |
          for dir in \
            api-gateway/api-gateway \
            auth-service/auth-service \
            card-service/card-service \
            fraud-detection-service/fraud-detection-service \
            transaction-service/transaction-service \
            user-service/user-service
          do
            echo "Building $dir"
            mvn -B package --file "$dir/pom.xml" -DskipTests
          done

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway/api-gateway
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v6
        with:
          context: ./auth-service/auth-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:latest

      - name: Build and Push Card Service
        uses: docker/build-push-action@v6
        with:
          context: ./card-service/card-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/card-service:latest

      - name: Build and Push Fraud Detection Service
        uses: docker/build-push-action@v6
        with:
          context: ./fraud-detection-service/fraud-detection-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fraud-detection-service:latest

      - name: Build and Push Transaction Service
        uses: docker/build-push-action@v6
        with:
          context: ./transaction-service/transaction-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/transaction-service:latest

      - name: Build and Push User Service
        uses: docker/build-push-action@v6
        with:
          context: ./user-service/user-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/user-service:latest
