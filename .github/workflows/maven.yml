name: Java CI with Maven

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build all microservices
        run: |
          for dir in api-gateway/api-gateway auth-service/auth-service card-service/card-service fraud-detection-service/fraud-detection-service transaction-service/transaction-service user-service/user-service; do
            echo "Building $dir"
            mvn -B package --file "$dir/pom.xml" -DskipTests
          done
